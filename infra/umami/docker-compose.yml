services:
  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DATABASE_PASSWORD}
      TZ: UTC
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 12

  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    ports:
      - "${UMAMI_PORT:-127.0.0.1:8505}:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DATABASE_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      CLIENT_IP_HEADER: ${UMAMI_CLIENT_IP_HEADER:-cf-connecting-ip}
      DISABLE_TELEMETRY: "1"
      PRIVATE_MODE: "1"
      TZ: UTC

volumes:
  umami-db:
